name: mana_pantalu
description: "Mana Pantalu — Telugu-first AI farming assistant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # AI & Vision
  google_generative_ai: ^0.4.6

  # UI & Voice & Features
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.3
  speech_to_text: ^7.3.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  geolocator: ^13.0.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/districts.json
    - assets/env.example.json
